pluginManagement {
    includeBuild 'build-logic'

    repositories {
        gradlePluginPortal()
        mavenCentral()

        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
        }

        maven {
            name = 'NeoForge'
            url = uri('https://maven.neoforged.net/releases')
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()

        maven {
            name = 'Fabric'
            url = uri('https://maven.fabricmc.net/')
        }

        maven {
            name = 'NeoForge'
            url = uri('https://maven.neoforged.net/releases')
        }
    }
}

rootProject.name = 'peacefulaura'
include 'common'
include 'fabric'
include 'neoforge'